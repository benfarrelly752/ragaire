<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ragaire — archive</title>
    <meta name="description" content="the ragaire archive — everything ever made, scattered on a wall with red string.">
    <link rel="shortcut icon" href="assets/web/logo.gif" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
</head>
<body>
<!-- header / menu / cart injected by site.js — edit them there, once.
     the tiles live in assets/manifest.js — one line each. add a line, it's on the wall. -->

<div class="archive-header">
    <h1>archive</h1>
    <p>everything ever once</p>
</div>

<div class="scatter-field">
    <canvas id="conspiracy-lines"></canvas>
</div>

<div class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lightbox-close" aria-label="Close">&#x2715;</button>
    <img alt="">
    <iframe frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <video controls playsinline style="display:none"></video>
    <span class="lightbox-cap"></span>
</div>

<footer class="site-footer">ragaire — everything ever done</footer>

<script src="products.js"></script>
<script src="assets/manifest.js"></script>
<script src="site.js"></script>
</body>
</html>
